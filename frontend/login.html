<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CodeReviewHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-brand">
      <h1>
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent);vertical-align:middle;margin-right:8px;"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
        CodeReviewHub
      </h1>
      <p style="font-size: 18px; margin-top: 16px;">Collaborative code review, version history, and actionable feedback.</p>
      <ul style="margin-top: 32px; list-style: none;">
        <li style="margin-bottom: 12px; display:flex; align-items:center; gap:8px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent)"><polyline points="20 6 9 17 4 12"></polyline></svg>
          Line-level reviews
        </li>
        <li style="margin-bottom: 12px; display:flex; align-items:center; gap:8px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent)"><polyline points="20 6 9 17 4 12"></polyline></svg>
          Version history
        </li>
        <li style="margin-bottom: 12px; display:flex; align-items:center; gap:8px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent)"><polyline points="20 6 9 17 4 12"></polyline></svg>
          Team collaboration
        </li>
      </ul>
    </div>
    <div class="auth-form-wrapper">
      <div class="card" style="max-width: 400px; width: 100%;">
        <h2 class="mb-1">Welcome back</h2>
        <p class="text-muted mb-4">Please enter your details to sign in.</p>
        
        <form id="login-form">
          <div class="form-group">
            <label class="form-label">Username or Email</label>
            <input type="text" id="login-identifier" class="form-control" required>
            <div class="form-error" id="login-error" style="display:none;"></div>
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <div style="position:relative;">
              <input type="password" id="login-password" class="form-control" required>
              <button type="button" id="btn-toggle-password" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); color:var(--text-secondary); background:none; border:none; cursor:pointer;">Show</button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary mt-2" style="width: 100%;">Sign In</button>
        </form>
        
        <div class="mt-3 text-center">
          <a href="#" id="demo-login" class="text-small">Use demo account (Prasanna)</a>
        </div>
        <div class="mt-4 text-center text-small text-muted">
          Don't have an account? <a href="register.html">Sign up</a>
        </div>
      </div>
    </div>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
