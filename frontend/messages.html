<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages - CodeReviewHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <div class="app-container">
    <div class="main-content">
      <div class="page-content">
        <div class="page-header">
          <div>
            <h1 class="page-title">Messages</h1>
            <p class="page-subtitle">Direct messages with team members.</p>
          </div>
        </div>
        <div class="card" style="padding:0; display:flex; height: 60vh;">
           <div style="width: 250px; border-right: 1px solid var(--border); display:flex; flex-direction:column;">
               <div style="padding:16px; font-weight:bold; border-bottom:1px solid var(--border);">Projects</div>
               <div id="msg-projects-list" style="overflow-y:auto; flex:1;"></div>
           </div>
           <div style="flex:1; display:flex; flex-direction:column; min-width:0;">
               <div id="msg-header" style="padding:16px; border-bottom:1px solid var(--border); font-weight:bold;">Select a project</div>
               <div id="msg-content" style="flex:1; padding:16px; overflow-y:auto; display:flex; flex-direction:column; gap:12px;">
                    <div class="text-center text-muted mt-4">Select a project to view messages</div>
               </div>
               <div id="msg-form-container" style="padding:16px; border-top:1px solid var(--border); display:none;">
                   <form id="msg-form" style="display:flex; gap:8px;">
                       <input type="text" id="msg-input" class="form-control" style="flex:1;" placeholder="Type a message..." required autocomplete="off">
                       <button type="submit" class="btn btn-primary" id="msg-send-btn">Send</button>
                   </form>
               </div>
           </div>
        </div>
      </div>
    </div>
  </div>
  <script src="js/icons.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/messages.js"></script>
</html>
