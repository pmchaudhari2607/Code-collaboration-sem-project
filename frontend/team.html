<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team - CodeReviewHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <div class="app-container">
    <div class="main-content">
      <div class="page-content">
        <div class="page-header">
          <div>
            <h1 class="page-title">Team</h1>
            <p class="page-subtitle">Manage members across your projects.</p>
          </div>
          <button class="btn btn-primary" onclick="UI.openModal('modal-invite')">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Invite Member
          </button>
        </div>
        
        <div class="card" style="padding:0; overflow:hidden;">
           <table id="table-team">
              <thead>
                 <tr>
                    <th>User</th>
                    <th>Project</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>Joined</th>
                 </tr>
              </thead>
              <tbody></tbody>
           </table>
        </div>
      </div>
    </div>
  </div>
  
  <div class="modal-backdrop" id="modal-invite">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Invite to Project</h3>
        <button class="modal-close" onclick="UI.closeModal('modal-invite')">
           <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <form id="form-invite">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label">Project</label>
            <select id="invite-project" class="form-control" required></select>
          </div>
          <div class="form-group">
            <label class="form-label">User to Invite</label>
            <select id="invite-user" class="form-control" required></select>
          </div>
          <div class="form-group">
            <label class="form-label">Role</label>
            <select id="invite-role" class="form-control">
               <option value="collaborator">Collaborator</option>
               <option value="viewer">Viewer</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="UI.closeModal('modal-invite')">Cancel</button>
          <button type="submit" class="btn btn-primary">Send Invitation</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/team.js"></script>
</body>
</html>
